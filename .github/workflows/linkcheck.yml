name: Resource URL scan (review only)
on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 1 1,4,7,10 *'
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate metadata
        run: python3 scripts/validate_repo.py
      - name: Spot-check external source URLs
        run: python3 scripts/check_links.py --limit 125 --sleep 0.4
      - name: Attach report for human review
        uses: actions/upload-artifact@v4
        with:
          name: resource-check-report
          path: data/link_check_latest.csv
