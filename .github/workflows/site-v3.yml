name: Validate student-facing website
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: node tests/core.test.js && node scripts/build_site.js && node tests/site.test.js
      - run: node --check site3/app.js && node --check site3/planner.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-student-site
          path: dist/
          retention-days: 14
